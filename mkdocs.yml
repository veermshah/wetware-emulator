site_name: wetware-emulator
site_description: A simulated cortical culture on a virtual multi-electrode array.
site_url: https://veermshah.github.io/wetware-emulator/
repo_url: https://github.com/veermshah/wetware-emulator
repo_name: veermshah/wetware-emulator
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - API overview: api.md
  - The model: model.md
  - HDF5 file format: file-format.md
  - Reference: reference.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
