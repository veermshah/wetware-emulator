[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wetware"
version = "0.1.0"
description = "A simulated cortical culture on a virtual multi-electrode array, for prototyping biocompute experiments without a wet lab."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Veer Shah" }]
requires-python = ">=3.10"
keywords = ["neuroscience", "biocomputing", "wetware", "multi-electrode-array", "simulation", "spiking-neural-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
plot = ["matplotlib>=3.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
dev = [
    "wetware[server,plot]",
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "build",
]

[project.scripts]
wetware = "wetware.cli:main"

[project.urls]
Homepage = "https://github.com/veermshah/wetware-emulator"
Documentation = "https://veermshah.github.io/wetware-emulator/"
Source = "https://github.com/veermshah/wetware-emulator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wetware = ["static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/wetware"]
